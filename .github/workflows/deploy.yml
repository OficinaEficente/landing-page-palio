name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static Open Graph image
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -r 13235-193826 https://raw.githubusercontent.com/OficinaEficente/site_palio/main/index.html \
            | tr -d '\r\n' \
            | base64 --decode > public/og-palio.jpg
          test -s public/og-palio.jpg
          file public/og-palio.jpg

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
